name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t caw-api:${{ github.sha }} ./api
      - name: Run Tests
        run: |
          docker run --rm caw-api:${{ github.sha }} pytest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy
        run: |
          echo "Deploying image tag ${{ github.sha }} to production..."
          # Mock deploy hook for local exercise
          sleep 5 

      - name: Wait for Readiness Check
        run: |
          echo "Waiting for /ready to return 200 OK..."
          # In a real environment, this targets the production URL
          # Using mock validation for the exercise
          for i in {1..10}; do
            # Mocking a successful readiness response
            echo "Attempt $i: status 200 OK"
            exit 0
          done
          echo "Readiness check failed"
          exit 1

      - name: Post-Deploy Smoke Test
        run: |
          echo "Verifying /live, /ready, and /metrics..."
          echo "Smoke tests passed."

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "Deployment or readiness failed. Triggering automated rollback..."
          # railway rollback / fly releases rollback
