name: API Gateway CI

on:
  push:
    branches:
      - '**' # Run tests on all branches

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # FIX 2: Automatically caches ~/.npm based on package-lock.json

      - name: Install Dependencies
        run: npm ci # Uses the lockfile for reproducible, clean installs

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: test # Enforces the sequential quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' # FIX 3: Only run on the main branch
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIX 1: We authenticate using the action, NEVER echoing the password in a run step
      - name: Log in to Registry
        run: echo "Pretending to log in securely without echoing secrets..."
        # In reality, you'd use docker/login-action here with secrets.REGISTRY_PASSWORD

      - name: Build and Tag
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "Building apigw:$TAG"
          docker build -t apigw:$TAG .
